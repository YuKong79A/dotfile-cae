# Local mpv + SVP + uosc (separate from Tsukimi's mpv configuration).
# mpvSockets.lua assigns a unique socket when several mpv windows are open.
input-ipc-server=/tmp/mpvsocket

# SVP needs frames in system memory; copy-back hardware decoding allows this.
hwdec=nvdec-copy
hwdec-codecs=all
hr-seek-framedrop=no

# Video output and scaling for RTX 3060 Mobile / 2560x1440.
vo=gpu-next
gpu-api=auto
gpu-context=auto
scale=ewa_lanczos
cscale=ewa_lanczos
dscale=mitchell
scale-antiring=0.6
cscale-antiring=0.6
correct-downscaling=yes
sigmoid-upscaling=yes

# Output depth and HDR stay matched to the display.
dither=fruit
dither-depth=auto
temporal-dither=no
target-colorspace-hint=auto
tone-mapping=auto
target-prim=auto
target-trc=auto
target-peak=auto
inverse-tone-mapping=no

# Reduce banding in anime and compressed video.
deband=yes
deband-iterations=1
deband-threshold=48
deband-range=16
deband-grain=32

# SVP performs frame interpolation; keep mpv's interpolation disabled.
interpolation=no
video-sync=audio

# uosc provides controls, a seek bar, volume display, and window decoration.
osc=no
osd-bar=no
border=no

# Preserve the previous playback-position preference.
save-position-on-quit=no
