# Tsukimi + SVP. SVP uses this socket to find Tsukimi's libmpv instance.
input-ipc-server=/tmp/mpvsocket

# VapourSynth/SVP needs software-accessible frames. An on-load script sets
# nvdec-copy after Tsukimi's hardware-decoding menu has initialized libmpv.
hwdec=nvdec-copy
hwdec-codecs=all
hr-seek-framedrop=no

# Tsukimi selects gpu-next itself. Keep the API/context automatic for Wayland.
gpu-api=auto
gpu-context=auto

# Balanced scaling for the RTX 3060 Mobile and 2560x1440 display.
scale=ewa_lanczos
cscale=ewa_lanczos
dscale=mitchell
scale-antiring=0.6
cscale-antiring=0.6
correct-downscaling=yes
sigmoid-upscaling=yes

# Keep output bit depth and HDR handling tied to the actual display.
dither=fruit
dither-depth=auto
temporal-dither=no
target-colorspace-hint=auto
tone-mapping=auto
target-prim=auto
target-trc=auto
target-peak=auto
inverse-tone-mapping=no

# Mild debanding helps animation gradients and compressed dark scenes.
deband=yes
deband-iterations=1
deband-threshold=48
deband-range=16
deband-grain=32

# SVP handles frame interpolation. Tsukimi also sets video-sync=audio.
interpolation=no
video-sync=audio
